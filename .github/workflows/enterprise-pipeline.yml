name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [master, main, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # SECURITY & QUALITY CHECKS
  # ============================================
  security-scan:
    name: 🔒 Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run npm audit
        working-directory: ./turn-one-client
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > npm-audit.json || true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-results.sarif
            turn-one-client/npm-audit.json
          retention-days: 30

  # ============================================
  # CODE QUALITY & LINTING
  # ============================================
  code-quality:
    name: 📊 Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Frontend Linting
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: turn-one-client/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./turn-one-client
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./turn-one-client
        run: npm run lint
        continue-on-error: true
      
      - name: Run TypeScript type check
        working-directory: ./turn-one-client
        run: npm run type-check
      
      # Backend Analysis
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore .NET dependencies
        run: dotnet restore turn-one-backend/turn-one-backend.sln
      
      - name: Run .NET format check
        run: dotnet format turn-one-backend/turn-one-backend.sln --verify-no-changes --verbosity diagnostic
        continue-on-error: true
      
      - name: Analyze .NET code
        run: dotnet build turn-one-backend/turn-one-backend.sln --configuration Release /p:TreatWarningsAsErrors=false

  # ============================================
  # BUILD & TEST - BACKEND
  # ============================================
  build-backend:
    name: 🏗️ Build Backend (.NET 9)
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: dotnet restore turn-one-backend/turn-one-backend.sln
      
      - name: Build solution
        run: dotnet build turn-one-backend/turn-one-backend.sln --no-restore --configuration Release
      
      - name: Run unit tests
        run: |
          dotnet test turn-one-backend/turn-one-backend.sln \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        continue-on-error: true
      
      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 30
      
      - name: Publish backend artifacts
        run: dotnet publish turn-one-backend/API/API.csproj --configuration Release --output ./publish
      
      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: ./publish/
          retention-days: 7

  # ============================================
  # BUILD & TEST - FRONTEND
  # ============================================
  build-frontend:
    name: 🎨 Build Frontend (Next.js 15)
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: turn-one-client/package-lock.json
      
      - name: Install dependencies
        working-directory: ./turn-one-client
        run: npm ci
      
      - name: Build Next.js application
        working-directory: ./turn-one-client
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
      
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: |
            turn-one-client/.next/
            turn-one-client/public/
            turn-one-client/package.json
            turn-one-client/next.config.ts
          retention-days: 7

  # ============================================
  # AUTO VERSION UPDATE
  # ============================================
  auto-version:
    name: 🔖 Auto Version Update
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Check for version bump needed
        id: check
        run: |
          # Make script executable
          chmod +x scripts/update-version-auto.sh
          
          # Check if we need a version bump
          if ./scripts/update-version-auto.sh --dry-run | grep -q "No version bump needed"; then
            echo "needs_bump=false" >> $GITHUB_OUTPUT
            echo "No conventional commits found, skipping version update"
          else
            echo "needs_bump=true" >> $GITHUB_OUTPUT
            echo "Conventional commits detected, version bump needed"
          fi
      
      - name: Run version update
        if: steps.check.outputs.needs_bump == 'true'
        id: version
        run: |
          # Run the version update script
          ./scripts/update-version-auto.sh
          
          # Get the new version
          NEW_VERSION=$(cat turn-one-backend/VERSION)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Updated to version: $NEW_VERSION"
      
      - name: Commit and push version changes
        if: steps.check.outputs.needs_bump == 'true'
        run: |
          git add turn-one-backend/VERSION turn-one-client/package.json CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"
          git push
      
      - name: Create and push tag
        if: steps.check.outputs.needs_bump == 'true'
        run: |
          git tag "v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"
      
      - name: Create GitHub Release
        if: steps.check.outputs.needs_bump == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          release_name: Release ${{ steps.version.outputs.new_version }}
          body: |
            Auto-generated release from conventional commits.
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false

  