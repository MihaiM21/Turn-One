name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [master, main, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # SECURITY & QUALITY CHECKS
  # ============================================
  security-scan:
    name: 🔒 Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run npm audit
        working-directory: ./turn-one-client
        run: |
          npm audit --audit-level=moderate || true
          npm audit --json > npm-audit.json || true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-results.sarif
            turn-one-client/npm-audit.json
          retention-days: 30

  # ============================================
  # CODE QUALITY & LINTING
  # ============================================
  code-quality:
    name: 📊 Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Frontend Linting
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: turn-one-client/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./turn-one-client
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./turn-one-client
        run: npm run lint
        continue-on-error: true
      
      - name: Run TypeScript type check
        working-directory: ./turn-one-client
        run: npm run type-check
      
      # Backend Analysis
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore .NET dependencies
        run: dotnet restore turn-one-backend/turn-one-backend.sln
      
      - name: Run .NET format check
        run: dotnet format turn-one-backend/turn-one-backend.sln --verify-no-changes --verbosity diagnostic
        continue-on-error: true
      
      - name: Analyze .NET code
        run: dotnet build turn-one-backend/turn-one-backend.sln --configuration Release /p:TreatWarningsAsErrors=false

  # ============================================
  # BUILD & TEST - BACKEND
  # ============================================
  build-backend:
    name: 🏗️ Build Backend (.NET 9)
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore dependencies
        run: dotnet restore turn-one-backend/turn-one-backend.sln
      
      - name: Build solution
        run: dotnet build turn-one-backend/turn-one-backend.sln --no-restore --configuration Release
      
      - name: Run unit tests
        run: |
          dotnet test turn-one-backend/turn-one-backend.sln \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        continue-on-error: true
      
      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 30
      
      - name: Publish backend artifacts
        run: dotnet publish turn-one-backend/API/API.csproj --configuration Release --output ./publish
      
      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: ./publish/
          retention-days: 7

  # ============================================
  # BUILD & TEST - FRONTEND
  # ============================================
  build-frontend:
    name: 🎨 Build Frontend (Next.js 15)
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: turn-one-client/package-lock.json
      
      - name: Install dependencies
        working-directory: ./turn-one-client
        run: npm ci
      
      - name: Build Next.js application
        working-directory: ./turn-one-client
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
      
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: |
            turn-one-client/.next/
            turn-one-client/public/
            turn-one-client/package.json
            turn-one-client/next.config.ts
          retention-days: 7

  # ============================================
  # DOCKER BUILD & SCAN
  # ============================================
  docker-build:
    name: 🐳 Build & Scan Docker Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
      packages: write
      security-events: write
    
    strategy:
      matrix:
        service: [api, client]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}
      
      - name: Run Trivy vulnerability scanner (Docker image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: 'sarif'
          output: 'trivy-docker-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-docker-${{ matrix.service }}.sarif'
          category: docker-${{ matrix.service }}
      
      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # INTEGRATION TESTS
  # ============================================
  integration-tests:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Start services with Docker Compose
        run: |
          docker-compose up -d
          echo "Waiting for services to be healthy..."
          timeout 120 sh -c 'until docker-compose ps | grep -q "healthy"; do sleep 2; done'
      
      - name: Wait for API to be ready
        run: |
          echo "Waiting for API health check..."
          for i in {1..30}; do
            if curl -f http://localhost:5271/health; then
              echo "API is healthy!"
              break
            fi
            echo "Attempt $i: API not ready yet..."
            sleep 2
          done
      
      - name: Wait for Client to be ready
        run: |
          echo "Waiting for Client health check..."
          for i in {1..30}; do
            if curl -f http://localhost:3000/api/health; then
              echo "Client is healthy!"
              break
            fi
            echo "Attempt $i: Client not ready yet..."
            sleep 2
          done
      
      - name: Run API smoke tests
        run: |
          echo "Testing API endpoints..."
          curl -f http://localhost:5271/health || exit 1
          curl -f http://localhost:5271/swagger/index.html || exit 1
      
      - name: Run Client smoke tests
        run: |
          echo "Testing Client..."
          curl -f http://localhost:3000 || exit 1
      
      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== API Logs ==="
          docker-compose logs api
          echo "=== Client Logs ==="
          docker-compose logs client
      
      - name: Cleanup
        if: always()
        run: docker-compose down -v

  # ============================================
  # PERFORMANCE & LOAD TESTS
  # ============================================
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Start services
        run: docker-compose up -d
      
      - name: Wait for services
        run: sleep 30
      
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      
      - name: Run load tests
        run: |
          cat > loadtest.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          
          export let options = {
            stages: [
              { duration: '30s', target: 20 },
              { duration: '1m', target: 20 },
              { duration: '30s', target: 0 },
            ],
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.05'],
            },
          };
          
          export default function () {
            let res = http.get('http://localhost:5271/health');
            check(res, { 'status was 200': (r) => r.status == 200 });
            sleep(1);
          }
          EOF
          
          k6 run loadtest.js || true
      
      - name: Cleanup
        if: always()
        run: docker-compose down -v

  