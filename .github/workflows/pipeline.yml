name: Dual Environment CI/CD Pipeline

on:
  push:
    branches: [ master, dev ]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20'

jobs:
  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: turn-one-client/package-lock.json
        
        
    - name: Restore .NET dependencies
      run: dotnet restore turn-one-backend/turn-one-backend.sln
      
    - name: Build .NET solution
      run: |
        dotnet build turn-one-backend/turn-one-backend.sln \
          --no-restore \
          --configuration Release \
          
      
    - name: Install client dependencies
      run: npm ci
      working-directory: ./turn-one-client
      
    - name: Build client application
      run: npm run build
      working-directory: ./turn-one-client
      env:
        NODE_ENV: production
        NEXT_TELEMETRY_DISABLED: 1
        NEXT_PUBLIC_API_URL: https://api.t1f1.com