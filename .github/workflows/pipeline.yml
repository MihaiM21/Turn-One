name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ master, dev, 'release/*', 'hotfix/*' ]
  pull_request:
    branches: [ master, dev ]
    types: [opened, synchronize, reopened, ready_for_review]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/api
  IMAGE_NAME_CLIENT: ${{ github.repository }}/client

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: 🔒 Security & Compliance Scan
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js for client security scan
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: turn-one-client/package-lock.json
        
    - name: Install client dependencies
      run: npm ci
      working-directory: ./turn-one-client
      
    - name: Run npm audit
      run: npm audit --audit-level=moderate
      working-directory: ./turn-one-client
      continue-on-error: true
      
    - name: Setup .NET for API security scan
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore .NET dependencies
      run: dotnet restore turn-one-backend/turn-one-backend.sln
      
    - name: Run .NET security analysis
      run: |
        dotnet list turn-one-backend/turn-one-backend.sln package --vulnerable --include-transitive
        dotnet list turn-one-backend/turn-one-backend.sln package --deprecated

  code-quality:
    name: 📊 Code Quality & Analysis
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    needs: security-scan
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: turn-one-client/package-lock.json
        
    - name: Install client dependencies
      run: npm ci
      working-directory: ./turn-one-client
      
    - name: Run ESLint
      run: npm run lint
      working-directory: ./turn-one-client
      
    - name: Run TypeScript type checking
      run: npm run type-check
      working-directory: ./turn-one-client
      
    - name: Restore .NET dependencies
      run: dotnet restore turn-one-backend/turn-one-backend.sln
      
    - name: Run .NET format check
      run: dotnet format turn-one-backend/turn-one-backend.sln --verify-no-changes --verbosity diagnostic

  build-api:
    name: 🏗️ Build .NET API
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    outputs:
      version: ${{ steps.version.outputs.version }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache .NET packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
        
    - name: Read version
      id: version
      run: |
        VERSION=$(cat VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
        
    - name: Restore dependencies
      run: dotnet restore turn-one-backend/turn-one-backend.sln
      
    - name: Build solution
      run: |
        dotnet build turn-one-backend/turn-one-backend.sln \
          --no-restore \
          --configuration Release \
          -p:Version=${{ steps.version.outputs.version }} \
          -p:AssemblyVersion=${{ steps.version.outputs.version }} \
          -p:FileVersion=${{ steps.version.outputs.version }}
          
    - name: Run unit tests
      run: |
        dotnet test turn-one-backend/turn-one-backend.sln \
          --no-build \
          --configuration Release \
          --logger trx \
          --results-directory ./test-results \
          --collect:"XPlat Code Coverage" \
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      continue-on-error: false
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-test-results
        path: ./test-results/
        
    - name: Publish API
      run: |
        dotnet publish turn-one-backend/API/API.csproj \
          --configuration Release \
          --output ./api-publish \
          -p:Version=${{ steps.version.outputs.version }} \
          --self-contained false
          
    - name: Upload API artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api-artifacts-${{ steps.version.outputs.version }}
        path: ./api-publish/
        retention-days: 30

  build-client:
    name: 🎨 Build Next.js Client
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: turn-one-client/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      working-directory: ./turn-one-client
      
    - name: Read version
      id: version
      run: |
        VERSION=$(cat VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
    - name: Update package.json version
      run: |
        npm version ${{ steps.version.outputs.version }} --no-git-tag-version
      working-directory: ./turn-one-client
      
    - name: Build application
      run: |
        npm run build
      working-directory: ./turn-one-client
      env:
        NODE_ENV: production
        NEXT_TELEMETRY_DISABLED: 1
        
    - name: Upload client artifacts
      uses: actions/upload-artifact@v4
      with:
        name: client-artifacts-${{ steps.version.outputs.version }}
        path: |
          ./turn-one-client/.next/
          ./turn-one-client/public/
          ./turn-one-client/package.json
        retention-days: 30

  integration-tests:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest
    needs: [build-api, build-client]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    
    services:
      sqlite:
        image: keinos/sqlite3:latest
        options: >-
          --health-cmd "sqlite3 --version"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: turn-one-client/package-lock.json
        
    - name: Download API artifacts
      uses: actions/download-artifact@v4
      with:
        name: api-artifacts-${{ needs.build-api.outputs.version }}
        path: ./api-artifacts/
        
    - name: Download Client artifacts
      uses: actions/download-artifact@v4
      with:
        name: client-artifacts-${{ needs.build-api.outputs.version }}
        path: ./client-artifacts/
        
    - name: Start API for testing
      run: |
        cd api-artifacts
        nohup dotnet API.dll --urls="http://localhost:5000" > api.log 2>&1 &
        sleep 10
        
    - name: Test API health endpoint
      run: |
        curl -f http://localhost:5000/health || exit 1
        echo "API health check passed"

  build-docker-images:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-api, build-client, integration-tests]
    if: github.ref == 'refs/heads/master'
    
    strategy:
      matrix:
        component: [api, client]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.component }}-artifacts-${{ needs.build-api.outputs.version }}
        path: ./artifacts/
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ matrix.component == 'api' && env.IMAGE_NAME_API || env.IMAGE_NAME_CLIENT }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}},value=${{ needs.build-api.outputs.version }}
          type=semver,pattern={{major}}.{{minor}},value=${{ needs.build-api.outputs.version }}
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./docker/${{ matrix.component }}/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  update-version:
    name: 📋 Update Version
    runs-on: ubuntu-latest
    needs: [build-api, build-client]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
    - name: Read current version
      id: current
      run: |
        CURRENT_VERSION=$(cat VERSION)
        echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        
    - name: Bump version
      id: bump
      run: |
        CURRENT_VERSION="${{ steps.current.outputs.version }}"
        IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
        
        # Check commit messages for version bump type
        if git log --format=%B -n 10 | grep -E "(BREAKING CHANGE|major)"; then
          NEW_MAJOR=$((major + 1))
          NEW_VERSION="$NEW_MAJOR.0.0"
        elif git log --format=%B -n 10 | grep -E "(feat|feature|minor)"; then
          NEW_MINOR=$((minor + 1))
          NEW_VERSION="$major.$NEW_MINOR.0"
        else
          NEW_PATCH=$((patch + 1))
          NEW_VERSION="$major.$minor.$NEW_PATCH"
        fi
        
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "Bumping version from $CURRENT_VERSION to $NEW_VERSION"
        
    - name: Update files with new version
      run: |
        echo "${{ steps.bump.outputs.new_version }}" > VERSION
        cd turn-one-client
        npm version ${{ steps.bump.outputs.new_version }} --no-git-tag-version
        
    - name: Commit and push changes
      run: |
        git add VERSION turn-one-client/package.json turn-one-client/package-lock.json
        git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
        git tag "v${{ steps.bump.outputs.new_version }}"
        git push origin master
        git push origin "v${{ steps.bump.outputs.new_version }}"

  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-docker-images, update-version]
    if: github.ref == 'refs/heads/master'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to staging environment
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "Version: ${{ needs.update-version.outputs.new_version }}"
        echo "API Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ needs.update-version.outputs.new_version }}"
        echo "Client Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CLIENT }}:${{ needs.update-version.outputs.new_version }}"
        
        # Add your staging deployment logic here
        # Examples:
        # - kubectl apply -f k8s/staging/
        # - helm upgrade --install staging-release ./helm-chart
        # - docker-compose -f docker-compose.staging.yml up -d
        
    - name: Run smoke tests
      run: |
        echo "🧪 Running smoke tests on staging..."
        # Add smoke test logic here
        
    - name: Notify deployment success
      run: |
        echo "✅ Staging deployment completed successfully!"

  deploy-production:
    name: 🌟 Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/master'
    environment: 
      name: production
      url: https://your-production-url.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download deployment artifacts
      uses: actions/download-artifact@v4
      with:
        name: api-artifacts-${{ needs.build-api.outputs.version }}
        path: ./api-artifacts/
        
    - name: Download client artifacts  
      uses: actions/download-artifact@v4
      with:
        name: client-artifacts-${{ needs.build-api.outputs.version }}
        path: ./client-artifacts/
        
    - name: Deploy to production
      run: |
        echo "🌟 Deploying to production environment..."
        echo "Version: ${{ needs.update-version.outputs.new_version }}"
        
        # Add your production deployment logic here
        # Examples:
        # - Blue/green deployment
        # - Rolling deployment
        # - Canary deployment
        
    - name: Run production health checks
      run: |
        echo "🏥 Running production health checks..."
        # Add health check logic here
        
    - name: Create GitHub release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ needs.update-version.outputs.new_version }}
        release_name: Release v${{ needs.update-version.outputs.new_version }}
        body: |
          ## What's Changed
          
          Auto-generated release for version ${{ needs.update-version.outputs.new_version }}
          
          ### 🚀 Deployment
          - ✅ Staging deployment completed
          - ✅ Production deployment completed
          - ✅ Health checks passed
          
          ### 📦 Artifacts
          - API: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}:${{ needs.update-version.outputs.new_version }}
          - Client: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CLIENT }}:${{ needs.update-version.outputs.new_version }}
        draft: false
        prerelease: false

  notify-teams:
    name: 📢 Notify Teams
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always() && github.ref == 'refs/heads/master'
    
    steps:
    - name: Notify on success
      if: needs.deploy-production.result == 'success'
      run: |
        echo "✅ Pipeline completed successfully!"
        # Add Slack/Teams/Discord notification here
        
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Pipeline failed!"
        # Add failure notification here