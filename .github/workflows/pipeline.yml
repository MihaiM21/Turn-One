  # ============================================
  # AUTO VERSION UPDATE (master only)
  # ============================================
  auto-version:
    name: Auto Version Update
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for version bump needed
        id: check
        run: |
          chmod +x scripts/update-version-auto.sh
          if ./scripts/update-version-auto.sh --dry-run | grep -q "No version bump needed"; then
            echo "needs_bump=false" >> $GITHUB_OUTPUT
            echo "No conventional commits found, skipping version update"
          else
            echo "needs_bump=true" >> $GITHUB_OUTPUT
            echo "Conventional commits detected, version bump needed"
          fi

      - name: Run version update script
        if: steps.check.outputs.needs_bump == 'true'
        id: version
        run: |
          ./scripts/update-version-auto.sh
          NEW_VERSION=$(cat turn-one-backend/VERSION)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Create version bump branch and commit
        if: steps.check.outputs.needs_bump == 'true'
        run: |
          BRANCH_NAME="version-bump-${{ steps.version.outputs.new_version }}"
          git checkout -b "$BRANCH_NAME"
          git add turn-one-backend/VERSION turn-one-client/package.json CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"
          git push -u origin "$BRANCH_NAME"

      - name: Extract changelog for PR body
        if: steps.check.outputs.needs_bump == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG_CONTENT=$(sed -n "/## \[$VERSION\]/,/## \[/p" CHANGELOG.md | sed '$d' | tail -n +2)
            [ -z "$CHANGELOG_CONTENT" ] && CHANGELOG_CONTENT="See CHANGELOG.md for details."
            echo "content<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # Fix: use --body-file with a heredoc to avoid shell quoting issues with changelog content
      - name: Create Pull Request
        if: steps.check.outputs.needs_bump == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "version-bump-${{ steps.version.outputs.new_version }}" \
            --title "chore: bump version to ${{ steps.version.outputs.new_version }}" \
            --body "$(cat << 'PREOF'
          ## Version Bump to ${{ steps.version.outputs.new_version }}

          This automated PR bumps the version based on conventional commits since the last release.

          ### Changes

          ${{ steps.changelog.outputs.content }}

          ### Files Updated
          - \`turn-one-backend/VERSION\`
          - \`turn-one-client/package.json\`
          - \`CHANGELOG.md\`

          ### Review Checklist
          - [ ] Version number is correct
          - [ ] CHANGELOG.md entries are accurate
          - [ ] All version files are updated consistently

          ---
          *Automatically generated by the version bump automation.*
          PREOF
          )"
