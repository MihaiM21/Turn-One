name: CI/CD Pipeline

on:
  push:
    branches: [master, main, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # LINT — FRONTEND
  # ============================================
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: turn-one-client/package-lock.json

      - name: Install dependencies
        working-directory: ./turn-one-client
        run: npm ci

      - name: Run ESLint
        working-directory: ./turn-one-client
        run: npm run lint
        continue-on-error: true

      - name: TypeScript type check
        working-directory: ./turn-one-client
        run: npm run type-check

  # ============================================
  # LINT — BACKEND
  # ============================================
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('turn-one-backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore turn-one-backend/turn-one-backend.sln

      - name: Format check
        run: dotnet format turn-one-backend/turn-one-backend.sln --verify-no-changes --verbosity diagnostic
        continue-on-error: true

      - name: Build (static analysis)
        run: dotnet build turn-one-backend/turn-one-backend.sln --no-restore --configuration Release /p:TreatWarningsAsErrors=false

  # ============================================
  # BUILD — BACKEND
  # ============================================
  build-backend:
    name: Build Backend (.NET 9)
    runs-on: ubuntu-latest
    needs: [lint-backend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('turn-one-backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore turn-one-backend/turn-one-backend.sln

      - name: Build solution
        run: dotnet build turn-one-backend/turn-one-backend.sln --no-restore --configuration Release

      - name: Run tests
        run: |
          dotnet test turn-one-backend/turn-one-backend.sln \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 30

      # Fix: --no-build reuses the build above instead of rebuilding
      - name: Publish backend
        run: dotnet publish turn-one-backend/API/API.csproj --no-build --configuration Release --output ./publish

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: ./publish/
          retention-days: 7

  # ============================================
  # BUILD — FRONTEND
  # ============================================
  build-frontend:
    name: Build Frontend (Next.js 15)
    runs-on: ubuntu-latest
    needs: [lint-frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: turn-one-client/package-lock.json

      - name: Install dependencies
        working-directory: ./turn-one-client
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: turn-one-client/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('turn-one-client/package-lock.json') }}
          restore-keys: nextjs-${{ runner.os }}-

      - name: Build Next.js application
        working-directory: ./turn-one-client
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      # Fix: upload standalone output only, not the whole .next/ (avoids including the cache)
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: |
            turn-one-client/.next/standalone/
            turn-one-client/.next/static/
            turn-one-client/public/
            turn-one-client/package.json
            turn-one-client/next.config.ts
          retention-days: 7

