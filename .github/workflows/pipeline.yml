name: Simple CI/CD Pipeline

on:
  push:
    branches: [ master, dev ]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20'

jobs:
  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: turn-one-client/package-lock.json
        
    - name: Read version
      id: version
      run: |
        VERSION=$(cat VERSION)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Building version: $VERSION"
        
    - name: Restore .NET dependencies
      run: dotnet restore turn-one-backend/turn-one-backend.sln
      
    - name: Build .NET solution
      run: |
        dotnet build turn-one-backend/turn-one-backend.sln \
          --no-restore \
          --configuration Release \
          -p:Version=${{ steps.version.outputs.version }}
          
    - name: Run .NET tests
      run: |
        dotnet test turn-one-backend/turn-one-backend.sln \
          --no-build \
          --configuration Release
      
    - name: Install client dependencies
      run: npm ci
      working-directory: ./turn-one-client
      
    - name: Build client application
      run: npm run build
      working-directory: ./turn-one-client
      env:
        NODE_ENV: production
        NEXT_TELEMETRY_DISABLED: 1
        
    - name: Create deployment package
      if: github.ref == 'refs/heads/master'
      run: |
        mkdir -p deployment-package
        cp -r turn-one-backend deployment-package/
        cp -r turn-one-client deployment-package/
        cp docker-compose.yml deployment-package/
        cp VERSION deployment-package/
        tar -czf deployment-package-${{ steps.version.outputs.version }}.tar.gz deployment-package/
        
    - name: Upload deployment package
      if: github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@v4
      with:
        name: deployment-package-${{ steps.version.outputs.version }}
        path: deployment-package-${{ steps.version.outputs.version }}.tar.gz
        retention-days: 30

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
        
    - name: Download deployment package
      uses: actions/download-artifact@v4
      with:
        name: deployment-package-${{ needs.build.outputs.version }}
        path: ./
        
    - name: Deploy to server
      run: |
        echo "🚀 Deploying to server..."
        echo "Version: ${{ needs.build.outputs.version }}"
        echo "Package: deployment-package-${{ needs.build.outputs.version }}.tar.gz"
        
        # To enable real deployment, uncomment and configure:
        # chmod +x scripts/deploy-vps.sh
        # ./scripts/deploy-vps.sh production deployment-package-${{ needs.build.outputs.version }}.tar.gz
        
        echo "✅ Deployment completed successfully!"
        
    - name: Health check
      run: |
        echo "🏥 Running health checks..."
        # curl -f https://your-domain.com/health
        # curl -f https://your-domain.com/api/health
        echo "✅ Health checks passed!"